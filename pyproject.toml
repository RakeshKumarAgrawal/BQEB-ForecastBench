[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bqeb-forecastbench"
version = "0.1.0"
description = "An open benchmarking framework for smart grid forecasting models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.4,<2",
    "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8,<2",
    "pre-commit>=3.6,<5",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["benchmark"]
strict = true