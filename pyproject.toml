[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bqeb-forecastbench"
dynamic = ["version"]
description = "An open benchmarking framework for smart grid forecasting models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rakesh Kumar Agrawal" }]
keywords = ["benchmarking", "forecasting", "machine-learning", "smart-grid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.4,<2",
    "seaborn>=0.13,<1",
    "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8,<2",
    "pandas-stubs>=2.1,<3",
    "pre-commit>=3.6,<5",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.4,<1",
    "types-PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/RakeshKumarAgrawal/BQEB-ForecastBench"
Issues = "https://github.com/RakeshKumarAgrawal/BQEB-ForecastBench/issues"
Repository = "https://github.com/RakeshKumarAgrawal/BQEB-ForecastBench.git"

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.setuptools.package-data]
benchmark = ["py.typed"]
"benchmark.config" = ["*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "benchmark.constants.VERSION" }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["benchmark"]
strict = true

[[tool.mypy.overrides]]
module = "joblib"
ignore_missing_imports = true
