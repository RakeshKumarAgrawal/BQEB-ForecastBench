repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy benchmark
        language: python
        additional_dependencies:
          - matplotlib>=3.8,<4
          - mypy>=1.8,<2
          - pandas-stubs>=2.1,<3
          - PyYAML>=6,<7
          - types-PyYAML>=6,<7
        pass_filenames: false
        types: [python]
